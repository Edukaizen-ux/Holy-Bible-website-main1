
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10251b">

  <title>Login | Holy Bible Online</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: 'DM Sans', sans-serif;
      color: #fff;

      background:
        radial-gradient(circle at 20% 20%, #294c36, transparent 40%),
        linear-gradient(135deg, #091810, #183c29, #0b1c13);
    }

    .login-container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      color: #d9b66c;
      font-size: 38px;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      margin: 0;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #c5d1c7;
      margin: 12px 0 30px;
      font-size: 14px;
    }

    .login-card {
      padding: 38px 30px;
      border-radius: 20px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.15);
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }

    .login-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 27px;
      margin: 0 0 10px;
    }

    .description {
      font-size: 13px;
      color: #c5d1c7;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .google-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #333;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      transition: .2s;
    }

    .google-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,.2);
    }

    .google-button:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    .google-button img {
      width: 20px;
      height: 20px;
    }

    #message {
      color: #ffd0b5;
      font-size: 12px;
      margin-top: 18px;
      line-height: 1.6;
    }

    #message.success {
      color: #a9e7b8;
    }

    .legal {
      color: #aebbb1;
      font-size: 11px;
      line-height: 1.8;
      margin-top: 25px;
    }

    .legal a {
      color: #e4c783;
      text-decoration: none;
    }

    .legal a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 25px;
      color: #aebbb1;
      font-size: 11px;
      letter-spacing: 2px;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 27px;
      }

      .login-card {
        padding: 30px 22px;
      }
    }
  </style>
</head>

<body>

  <main class="login-container">

    <div class="logo">✦</div>

    <h1>HOLY BIBLE ONLINE</h1>

    <p class="subtitle">
      Your daily companion in God's Word
    </p>

    <section class="login-card">

      <h2>Welcome Back</h2>

      <p class="description">
        Sign in with your Google account to continue
        reading the Holy Bible and saving your favorite verses.
      </p>

      <button
        type="button"
        class="google-button"
        id="googleSignIn"
      >
        <img
          src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
          alt="Google"
        >
        Continue with Google
      </button>

      <p id="message" role="status" aria-live="polite"></p>

      <p class="legal">
        By continuing, you agree to our
        <a href="terms.html">Terms of Service</a>
        and
        <a href="privacy.html">Privacy Policy</a>.
      </p>

    </section>

    <p class="footer">
      READ · REFLECT · GROW IN FAITH
    </p>

  </main>


  <!-- FIREBASE GOOGLE AUTHENTICATION -->

  <script type="module">

    import { auth } from "./firebase-config.js";

    import {
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";


    // GET HTML ELEMENTS

    const button = document.getElementById("googleSignIn");
    const message = document.getElementById("message");


    // GOOGLE AUTHENTICATION PROVIDER

    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({
      prompt: "select_account"
    });


    // DISPLAY MESSAGE

    function showMessage(text, type = "error") {

      message.textContent = text;

      message.className = type === "success" ? "success" : "";

    }


    // RESTORE GOOGLE LOGIN BUTTON

    function resetButton() {

      button.disabled = false;

      button.innerHTML = `
        <img
          src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
          alt="Google"
        >
        Continue with Google
      `;

    }


    // FIREBASE ERROR HANDLER

    function handleFirebaseError(error) {

      console.error("Firebase Authentication Error:", error);

      const errors = {

        "auth/popup-closed-by-user":
          "You closed the Google login window. Please try again.",

        "auth/popup-blocked":
          "Your browser blocked the login popup. Please allow popups.",

        "auth/unauthorized-domain":
          "Your website domain is not authorized. Add localhost to Firebase Authorized Domains.",

        "auth/operation-not-allowed":
          "Google sign-in is disabled. Enable Google Authentication in Firebase.",

        "auth/invalid-api-key":
          "Your Firebase API key is invalid. Check firebase-config.js.",

        "auth/network-request-failed":
          "Network error. Please check your internet connection.",

        "auth/cancelled-popup-request":
          "Another login request was started. Please try again.",

        "auth/account-exists-with-different-credential":
          "An account already exists with another sign-in method.",

        "auth/too-many-requests":
          "Too many login attempts. Please try again later."

      };

      showMessage(
        errors[error.code] ||
        `${error.code || "Error"}: ${error.message || "Unknown error"}`
      );

      resetButton();

    }


    // CHECK EXISTING LOGIN SESSION

    onAuthStateChanged(auth, (user) => {

      if (user) {

        console.log("User already logged in:", user.email);

        showMessage(
          "You are already logged in. Redirecting...",
          "success"
        );

        window.location.replace("index.html");

      }

    });


    // GOOGLE LOGIN BUTTON

    button.addEventListener("click", async () => {

      if (button.disabled) return;

      button.disabled = true;

      button.textContent = "Connecting to Google...";

      showMessage("Opening Google sign-in...", "success");


      try {

        // OPEN GOOGLE LOGIN POPUP

        const result = await signInWithPopup(auth, provider);


        // GET USER INFORMATION

        const user = result.user;

        console.log("Google Login Successful!");

        console.log("User ID:", user.uid);

        console.log("User Name:", user.displayName);

        console.log("User Email:", user.email);

        console.log("User Photo:", user.photoURL);


        // SUCCESS MESSAGE

        showMessage(
          "Login successful! Redirecting to Holy Bible Online...",
          "success"
        );


        // REDIRECT TO HOMEPAGE

        window.location.replace("index.html");


      } catch (error) {

        handleFirebaseError(error);

      }

    });


    // CHECK FIREBASE INITIALIZATION

    console.log("Holy Bible Online Login Initialized.");

    console.log("Firebase Authentication Ready:", !!auth);

  </script>

</body>
</html>
